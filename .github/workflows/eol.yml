name: EOL Checks
on:
  schedule:
   - cron: '0 10 * * *'
    
jobs:
  build:
    name: Ubuntu EOL check
    # This job runs on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Ubuntu and Ondrej PHP packages End-of-Life
        uses: sindrel/endoflife-github-action@v1.0.0
        with:
          product: ubuntu
          version: 20.04
          fail_on_eol: true
          fail_days_left: 90
